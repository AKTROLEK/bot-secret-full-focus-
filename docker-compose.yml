version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: streamer-bot-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: changeme

  bot:
    build: .
    container_name: streamer-bot
    restart: always
    depends_on:
      - mongodb
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://admin:changeme@mongodb:27017/streamer-bot?authSource=admin
    volumes:
      - ./logs:/app/logs

volumes:
  mongodb_data:
